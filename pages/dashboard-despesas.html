<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Notas de Despesa</title>

<link rel="stylesheet" href="../css/styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app">

<header class="topbar">
    <div class="logo-area">
        <img src="../assets/logo-monte-do-pasto.png" class="logo">
        <div class="titulo-app">Notas de Despesa</div>
    </div>
</header>

<div class="main">

<!-- SIDEBAR -->
<aside class="sidebar">

    <button class="nav-btn nav-active">
        Dashboard
    </button>

    <button class="nav-btn" onclick="window.location.href='nova-despesa.html'">
        Nova Nota de Despesa
    </button>

</aside>

<!-- CONTENT -->
<section class="content">

<h2>Dashboard</h2>

<!-- ================== CARDS ================== -->

<div class="cards">

    <div class="card">
        <div>Total</div>
        <h2 id="totalPedidos">0</h2>
    </div>

    <div class="card">
        <div>Pendentes</div>
        <h2 id="totalPendentes">0</h2>
    </div>

    <div class="card">
        <div>Aprovados</div>
        <h2 id="totalAprovados">0</h2>
    </div>

    <div class="card">
        <div>Rejeitados</div>
        <h2 id="totalRejeitados">0</h2>
    </div>

</div>

<br>

<!-- ================== FILTROS ================== -->

<div style="display:flex; gap:10px; margin-bottom:15px;">

    <input type="text" id="filtroPesquisa" placeholder="Pesquisar..." 
           style="padding:8px; border-radius:8px; border:1px solid #ccc; width:200px;">

    <select id="filtroEstado" style="padding:8px; border-radius:8px;">
        <option value="">Todos os estados</option>
        <option value="Pendente">Pendente</option>
        <option value="Aprovado">Aprovado</option>
        <option value="Rejeitado">Rejeitado</option>
    </select>

</div>

<!-- ================== TABELA ================== -->

<table>

<thead>
<tr>
    <th>Data</th>
    <th>Colaborador</th>
    <th>Total (€)</th>
    <th>Aprovador(es)</th>
    <th>Estado</th>
    <th></th>
</tr>
</thead>

<tbody id="tabelaDespesas">

</tbody>

</table>

</section>

</div>
</div>

<!-- ================== SCRIPTS ================== -->

<script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>

<script src="../js/auth.js"></script>
<script src="../js/graph.js"></script>
<script src="../js/despesas.js"></script>
<script src="../js/app.js"></script>

<script>

window.addEventListener("load", () => {
    carregarDashboardDespesas();
});

</script>

</body>
</html>
