<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Fatura</title>

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="app">

<header class="topbar">
  <div class="logo-area">
    <img src="../assets/logo-monte-do-pasto.png" class="logo">
    <div class="titulo-app">Aprovação de Faturas</div>
  </div>

  <div class="topbar-direita">
    <a href="dashboard.html" class="btn-voltar">← Voltar</a>
  </div>
</header>

<div class="main">

  <aside class="sidebar">

    <button class="nav-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
    <button class="nav-btn" onclick="window.location.href='aprovacoes.html'">Aprovações</button>
    <button class="nav-btn nav-active" onclick="window.location.href='nova-fatura.html'">Nova Fatura</button>
    <button class="nav-btn" onclick="window.location.href='pedidos.html'">Pedidos</button>

  </aside>

  <section class="content">

    <h2>Registar Fatura</h2>

    <div class="form-container">

      <div class="form-card">

        <!-- DADOS -->
        <div class="form-section">
          <h3>Dados da Fatura</h3>

          <div class="form-grid">

            <div>
              <label>Fornecedor</label>
              <input type="text" id="fornecedor">
            </div>

            <div>
              <label>Nº Fatura</label>
              <input type="text" id="numeroFatura">
            </div>

          </div>

        </div>

        <!-- APROVAÇÃO -->
        <div class="form-section">
  <h3>Aprovação</h3>

  <div class="form-grid">

    <div>
      <label>Aprovador</label>
      <select id="aprovador1">
        <option value="">Selecionar</option>
      </select>
    </div>

  </div>

  <button type="button" class="btn-add" onclick="mostrarSegundoAprovador()">
    + Adicionar segundo aprovador
  </button>

  <div id="segundoAprovadorBox" style="display:none; margin-top:15px;">

  <div class="form-grid">
    <div>
      <label>2º Aprovador</label>
      <select id="aprovador2">
        <option value="">Selecionar</option>
      </select>
    </div>
  </div>

</div>

</div>

        <!-- DOCUMENTO -->
        <div class="form-section">
          <h3>Documento</h3>

          <input type="file" id="ficheiroPDF" accept="application/pdf">
        </div>

        <!-- AÇÕES -->
        <div class="form-actions">

          <button onclick="guardarFatura()" class="btn-primary">
            Guardar Fatura
          </button>

          <a href="dashboard.html" class="btn-secondary">
            Cancelar
          </a>

        </div>

      </div>

    </div>

  </section>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/graph.js"></script>
<script src="../js/app.js"></script>

</body>

</html>
