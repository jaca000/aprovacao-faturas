<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="../css/styles.css">

</head>

<body>

<div class="app">

<header class="topbar">

<div class="logo-area">

<img src="../assets/logo-monte-do-pasto.png" class="logo">

<div class="titulo-app">
Aprovação de Faturas
</div>

</div>

<div id="utilizador"></div>

</header>

<div class="main">

<aside class="sidebar">

<button onclick="window.location.href='dashboard.html'">
Dashboard
</button>

<button onclick="window.location.href='aprovacoes.html'">
Aprovações
</button>

<button onclick="window.location.href='pedidos.html'">
Pedidos
</button>

<button id="btnNovaFatura">
Nova Fatura
</button>

<button id="btnNovaDespesa">
Nova Nota de Despesa
</button>

<button id="btnAdmin">
Administração
</button>

</aside>

<section class="content">

<h2>Dashboard</h2>

<div class="cards">

<div class="card">
<h3>Total</h3>
<p id="totalPedidos">0</p>
</div>

<div class="card">
<h3>Pendentes</h3>
<p id="pendentes">0</p>
</div>

<div class="card">
<h3>Aprovados</h3>
<p id="aprovados">0</p>
</div>

<div class="card">
<h3>Rejeitados</h3>
<p id="rejeitados">0</p>
</div>

</div>

<h2>Pedidos</h2>
<div class="toolbar">

<input type="text" id="pesquisa" placeholder="Pesquisar fornecedor ou nº fatura">

<select id="filtroEstado">
<option value="">Todos os estados</option>
<option value="Pendente">Pendentes</option>
<option value="Aprovado">Aprovados</option>
<option value="Rejeitado">Rejeitados</option>
</select>

</div>
<table id="tabelaPedidos">

<thead>
<tr>
<th></th>
<th onclick="ordenarTabela(1)">Nº Interno</th>
<th onclick="ordenarTabela(2)">Fornecedor</th>
<th onclick="ordenarTabela(3)">Nº Fatura</th>
<th onclick="ordenarTabela(4)">Valor</th>
<th onclick="ordenarTabela(5)">Estado</th>
</tr>
</thead>

<tbody id="listaPedidos">
</tbody>

</table>

</section>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/graph.js"></script>
<script src="../js/app.js"></script>

</body>

</table>
</div>

</div>

<br>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<script src="../js/auth.js"></script>
<script src="../js/graph.js"></script>
<script src="../js/app.js"></script>
</body>

</html>
