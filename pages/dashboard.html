<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/lucide@latest/dist/umd/lucide.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app">

<header class="topbar">

<div class="logo-area">

<img src="../assets/logo-monte-do-pasto.png" class="logo">

<div class="titulo-app">
Gestão de Despesas
</div>

</div>

<div class="topbar-direita">
<div id="dataHora"></div>
<div id="utilizador"></div>
</div>

</header>

<div class="main">

<aside class="sidebar">

<button class="nav-btn nav-active" onclick="window.location.href='dashboard.html'">
<i data-lucide="layout-dashboard"></i>
<span>Dashboard</span>
</button>

<button class="nav-btn" onclick="window.location.href='nova-despesa.html'">
<i data-lucide="receipt"></i>
<span>Nova Nota de Despesa</span>
</button>

<button class="nav-btn" onclick="window.location.href='aprovacoes-despesas.html'">
<i data-lucide="check-circle"></i>
<span>Aprovações</span>
</button>

<button class="nav-btn" id="menuAdmin">
<i data-lucide="settings"></i>
<span>Administração</span>
</button>

<div style="margin-top:20px; font-size:12px; color:#888;">DESPESAS</div>

<button class="nav-btn" onclick="window.location.href='dashboard-despesas.html'">
Dashboard Despesas
</button>

<button class="nav-btn" onclick="window.location.href='nova-despesa.html'">
Nova Nota de Despesa
</button>

</aside>

<section class="content">

<h2>Dashboard</h2>

<div class="cards">

<div class="card">
<div class="card-icon">
<i data-lucide="user-check"></i>
</div>
<h3>Para aprovar por mim</h3>
<p id="meusPendentes">0</p>
</div>

<div class="card">
<div class="card-icon">
<i data-lucide="file-text"></i>
</div>
<h3>Total</h3>
<p id="totalPedidos">0</p>
</div>

<div class="card">
<div class="card-icon">
<i data-lucide="clock"></i>
</div>
<h3>Pendentes</h3>
<p id="pendentes">0</p>
</div>

<div class="card">
<div class="card-icon">
<i data-lucide="check-circle"></i>
</div>
<h3>Aprovados</h3>
<p id="aprovados">0</p>
</div>

<div class="card">
<div class="card-icon">
<i data-lucide="x-circle"></i>
</div>
<h3>Rejeitados</h3>
<p id="rejeitados">0</p>
</div>

</div>

<h2>Pedidos</h2>

<div class="lista-pedidos">

<div class="acoes-tabela">

<button onclick="aprovarSelecionados()">Aprovar selecionados</button>

<button onclick="rejeitarSelecionados()">Rejeitar selecionados</button>

</div>

<div class="toolbar">

<input type="text" id="pesquisa" placeholder="Pesquisar fornecedor ou nº fatura">

<select id="filtroEstado">
<option value="">Todos os estados</option>
<option value="Pendente">Pendentes</option>
<option value="Aprovado">Aprovados</option>
<option value="Rejeitado">Rejeitados</option>
</select>

</div>

<table id="tabelaPedidos">

<thead>
<tr>
<th>
<input type="checkbox" id="checkTodos">
</th>
<th onclick="ordenarTabela(1)">Nº Interno</th>
<th onclick="ordenarTabela(2)">Fornecedor</th>
<th onclick="ordenarTabela(3)">Nº Fatura</th>
<th onclick="ordenarTabela(4)">Aprovador(es)</th>
<th onclick="ordenarTabela(5)">Estado</th>
</tr>
</thead>

<tbody id="listaPedidos">
</tbody>

</table>

</div>

</section>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

<script src="../js/auth.js"></script>
<script src="../js/graph.js"></script>
<script src="../js/app.js"></script>
<script src="../js/despesas.js"></script>

<script>
window.addEventListener("load", () => {
    carregarDashboardDespesas();
});
</script>
</body>
</html>
