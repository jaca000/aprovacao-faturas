<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Aprovação de Faturas</title>

<link rel="stylesheet" href="css/styles.css">

<style>

/* RESET BASE */
body{
margin:0;
font-family:system-ui, Arial, sans-serif;
overflow:hidden;
}

/* FUNDO ANIMADO */
.bg-animated{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;

background:
radial-gradient(circle at 20% 30%, #dbeafe 0%, transparent 40%),
radial-gradient(circle at 80% 20%, #e0e7ff 0%, transparent 40%),
radial-gradient(circle at 60% 80%, #c7d2fe 0%, transparent 40%),
linear-gradient(180deg,#f8fafc,#eef2f7);

animation:moveBg 12s ease-in-out infinite alternate;
}

@keyframes moveBg{
0%{transform:translateY(0px);}
100%{transform:translateY(-30px);}
}

/* LAYOUT */
.login-wrapper{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

/* CARD */
.login-box{
background:rgba(255,255,255,0.95);
padding:60px 70px;
border-radius:20px;

box-shadow:
0 25px 60px rgba(0,0,0,0.15);

text-align:center;

max-width:420px;
width:100%;
}

/* LOGO */
.login-box img{
height:70px;
margin-bottom:20px;
}

/* TITULO */
.login-box h1{
font-size:22px;
margin-bottom:10px;
}

/* SUBTITULO */
.login-box p{
font-size:14px;
color:#64748b;
margin-bottom:30px;
}

/* BOTÃO */
.login-btn{
background:linear-gradient(135deg,#3b82f6,#2563eb);
border:none;
color:white;

padding:14px 26px;
border-radius:12px;

font-weight:600;
cursor:pointer;

box-shadow:0 10px 25px rgba(37,99,235,0.35);

transition:all .25s;
}

.login-btn:hover{
transform:translateY(-2px);
box-shadow:0 20px 40px rgba(37,99,235,0.45);
}

/* LOADING */
.spinner{
width:28px;
height:28px;

border:3px solid #cbd5f5;
border-top:3px solid #3b82f6;

border-radius:50%;

margin:0 auto 10px;

animation:spin 0.8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

.loading-text{
font-size:13px;
color:#64748b;
}

</style>

</head>

<body>

<!-- FUNDO -->
<div class="bg-animated"></div>

<!-- LOGIN -->
<div class="login-wrapper">

<div class="login-box">

<div class="login-header">

<img src="assets/montedopasto.png" class="login-logo">

<div class="login-brand">
Monte do Pasto
</div>

</div>

<h1>Aprovação de Faturas</h1>

<p>
Sistema interno para gestão e aprovação de despesas
</p>

<button class="login-btn" onclick="iniciarLogin()" id="btnLogin">
Iniciar sessão com Microsoft
</button>

<!-- LOADING -->
<div id="loadingBox" style="display:none; margin-top:20px;">

<div class="spinner"></div>

<div class="loading-text">
A ligar ao sistema...
</div>

</div>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="js/auth.js"></script>

<script>

function iniciarLogin(){

document.getElementById("btnLogin").style.display = "none";
document.getElementById("loadingBox").style.display = "block";

login();

}

</script>

</body>

</html>
