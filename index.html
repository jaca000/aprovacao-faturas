<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Aprovação de Faturas</title>

<link rel="stylesheet" href="css/styles.css">

<style>

/* BASE */
body{
margin:0;
font-family:system-ui, Arial, sans-serif;
overflow:hidden;
}

/* FUNDO */
.bg-animated{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
z-index:-1;

background:
radial-gradient(circle at 20% 30%, #dbeafe 0%, transparent 40%),
radial-gradient(circle at 80% 20%, #e0e7ff 0%, transparent 40%),
radial-gradient(circle at 60% 80%, #c7d2fe 0%, transparent 40%),
linear-gradient(180deg,#f8fafc,#eef2f7);

animation:moveBg 12s ease-in-out infinite alternate;
}

@keyframes moveBg{
0%{transform:translateY(0px);}
100%{transform:translateY(-30px);}
}

/* LAYOUT */
.login-wrapper{
display:flex;
align-items:center;
justify-content:center;
height:100vh;
transition:all 0.5s ease;
}

/* TRANSIÇÃO LOGIN */
.fade-out{
opacity:0;
transform:scale(0.96);
filter:blur(6px);
}

/* CARD */
.login-box{
background:rgba(255,255,255,0.96);
padding:60px 70px;
border-radius:22px;

box-shadow:
0 30px 80px rgba(0,0,0,0.18);

text-align:center;

max-width:460px;
width:100%;
}

/* LOGO COM GLOW */
.login-logo{
height:90px;
margin-bottom:10px;

filter:drop-shadow(0 6px 18px rgba(59,130,246,0.25));

animation:logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
0%{transform:translateY(0px);}
50%{transform:translateY(-4px);}
100%{transform:translateY(0px);}
}

/* MARCA */
.login-brand{
font-size:12px;
letter-spacing:2px;
color:#64748b;
font-weight:600;
margin-bottom:6px;
}

/* TITULO */
.login-title{
font-size:24px;
font-weight:700;
margin-bottom:10px;
}

/* SUB */
.login-sub{
font-size:14px;
color:#64748b;
margin-bottom:35px;
}

/* BOTÃO */
.login-btn{
background:linear-gradient(135deg,#3b82f6,#2563eb);
border:none;
color:white;

padding:15px 28px;
border-radius:14px;

font-weight:600;
cursor:pointer;

box-shadow:0 12px 30px rgba(37,99,235,0.35);

transition:all .25s;
}

.login-btn:hover{
transform:translateY(-3px) scale(1.02);
box-shadow:0 25px 55px rgba(37,99,235,0.5);
}

/* LOADING */
.spinner{
width:30px;
height:30px;

border:3px solid #cbd5f5;
border-top:3px solid #3b82f6;

border-radius:50%;

margin:0 auto 10px;

animation:spin 0.8s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

.loading-text{
font-size:13px;
color:#64748b;
}

</style>

</head>

<body>

<div class="bg-animated"></div>

<div class="login-wrapper" id="loginWrapper">

<div class="login-box">

<img src="assets/montedopasto.png" class="login-logo">

<div class="login-brand">MONTE DO PASTO</div>

<div class="login-title">Aprovação de Faturas</div>

<div class="login-sub">
Sistema interno para gestão e aprovação de despesas
</div>

<button class="login-btn" onclick="iniciarLogin()" id="btnLogin">
Iniciar sessão com Microsoft
</button>

<div id="loadingBox" style="display:none; margin-top:20px;">

<div class="spinner"></div>

<div class="loading-text" id="loadingText">
A ligar ao sistema...
</div>

</div>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="js/auth.js"></script>

<script>

function iniciarLogin(){

document.getElementById("btnLogin").style.display = "none";
document.getElementById("loadingBox").style.display = "block";

/* animação saída */
document.getElementById("loginWrapper").classList.add("fade-out");

/* pequeno delay para UX */
setTimeout(() => {
login();
}, 600);

}
function iniciarLogin(){

document.getElementById("btnLogin").style.display = "none";
document.getElementById("loadingBox").style.display = "block";

document.getElementById("loginWrapper").classList.add("fade-out");

setTimeout(() => {
login();
}, 600);

}


/* DETETAR SE JÁ ESTÁ LOGADO */
window.addEventListener("load", async () => {

try{

const conta = msalInstance.getAllAccounts()[0];

if(conta){

document.getElementById("btnLogin").style.display = "none";
document.getElementById("loadingBox").style.display = "block";

const nome = conta.name || "Utilizador";

const texto = document.getElementById("loadingText");

texto.innerText = "Bem-vindo, " + nome.split(" ")[0];

/* pequeno delay para UX */
setTimeout(() => {
window.location.href = "pages/dashboard.html";
}, 1200);

}

}catch(e){
console.log("Sem sessão ativa");
}

});
  
</script>

</body>

</html>
