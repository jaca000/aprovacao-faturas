<!DOCTYPE html>
<html lang="pt">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Aprovação de Faturas</title>

<link rel="stylesheet" href="css/styles.css">

<style>

.login-page{

display:flex;
align-items:center;
justify-content:center;
height:100vh;

}

.login-card{

background:rgba(255,255,255,0.95);

padding:50px 60px;

border-radius:20px;

box-shadow:
0 20px 50px rgba(0,0,0,0.15);

text-align:center;

max-width:420px;
width:100%;

}

.login-logo{

height:70px;
margin-bottom:20px;

}

.login-title{

font-size:22px;
font-weight:bold;
margin-bottom:10px;

}

.login-sub{

font-size:14px;
color:#64748b;
margin-bottom:30px;

}

.login-btn{

background:linear-gradient(135deg,#3b82f6,#2563eb);

border:none;
color:white;

padding:14px 26px;

border-radius:12px;

font-size:15px;
font-weight:600;

cursor:pointer;

box-shadow:0 10px 25px rgba(37,99,235,0.35);

transition:all 0.25s;

}

.login-btn:hover{

transform:translateY(-2px);

box-shadow:0 20px 40px rgba(37,99,235,0.45);

}

</style>

</head>

<body>

<div class="login-page">

<div class="login-card">

<img src="assets/logo-monte-do-pasto.png" class="login-logo">

<div class="login-title">
Aprovação de Faturas
</div>

<div class="login-sub">
Sistema interno de gestão e aprovação de despesas
</div>

<button class="login-btn" onclick="login()">
Iniciar sessão com Microsoft
</button>

</div>

</div>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
